name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: 📥 拉取最新代码
        uses: actions/checkout@v4

      - name: 🧰 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 安装构建依赖
        run: npm ci

      - name: 🧰 构建 Chrome 与 Firefox 扩展
        run: npm run build

      - name: 🚀 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: TabulaBili ${{ github.ref_name }}
          files: |
            dist/TabulaBili-${{ github.ref_name }}-chrome.zip
            dist/tabulabili-${{ github.ref_name }}-firefox.xpi
          generate_release_notes: true
