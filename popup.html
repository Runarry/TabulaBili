<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabulaBili-Plus 推荐设置</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-main">
        <div class="logo-area">
          <img src="icon32.png" alt="Logo" class="logo">
          <h1 class="title">TabulaBili-Plus</h1>
        </div>
        <span class="version">V1.2.0</span>
      </div>
      <p class="subtitle">减少基于登录态与历史记录的推荐，让B站首页变得更随机泛化。</p>
    </header>

    <main class="main">
      <h2 class="section-title">扩展工作模式：</h2>
      <div class="modes-group">
        
        <label class="mode-card" for="modePure">
          <input type="radio" name="biliMode" id="modePure" value="pure">
          <div class="radio-circle"></div>
          <div class="mode-info">
            <div class="mode-name">纯净模式 <span class="badge badge-pure">最高纯净度</span></div>
            <div class="mode-desc">彻底阻止个人数据回传，享受最纯净内容。</div>
          </div>
        </label>

        <label class="mode-card" for="modeRefresh">
          <input type="radio" name="biliMode" id="modeRefresh" value="refresh">
          <div class="radio-circle"></div>
          <div class="mode-info">
            <div class="mode-name">探索模式 <span class="badge badge-refresh">推荐首选</span></div>
            <div class="mode-desc">将个性化内容作为探索起点，获取全网热门内容。</div>
          </div>
        </label>

        <label class="mode-card" for="modeMixed">
          <input type="radio" name="biliMode" id="modeMixed" value="mixed">
          <div class="radio-circle"></div>
          <div class="mode-info">
            <div class="mode-name">混合模式 <span class="badge badge-mixed">舒适·破圈并存</span></div>
            <div class="mode-desc">轮换请求个性化和热门内容！兼顾打破茧房和喜好推荐。</div>
          </div>
        </label>

        <label class="mode-card" for="modeFusion">
          <input type="radio" name="biliMode" id="modeFusion" value="fusion">
          <div class="radio-circle"></div>
          <div class="mode-info">
            <div class="mode-name">融合模式 <span class="badge badge-fusion">比例可调</span></div>
            <div class="mode-desc">同时获取探索与个性内容，按设置比例合并首页列表。</div>
          </div>
        </label>

        <label class="mode-card" for="modeOrigin">
          <input type="radio" name="biliMode" id="modeOrigin" value="origin">
          <div class="radio-circle"></div>
          <div class="mode-info">
            <div class="mode-name">个性模式 <span class="badge badge-origin">原生算法</span></div>
            <div class="mode-desc">恢复 B 站原汁原味的个性化算法推荐。</div>
          </div>
        </label>

      </div>
    </main>

    <section class="status-section">
      <div class="status-bar">
        <div class="status-left">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">正在获取扩展运行状态...</span>
        </div>
        <button class="reset-fingerprint-btn" id="resetFingerprintBtn" title="重置设备指纹并强制刷新网页">
          🔄 刷新设备指纹
        </button>
  </div>
    </section>

    <footer class="footer">
      <button type="button" class="link-btn footer-button" id="openOptionsBtn" title="管理融合比例和首页视频屏蔽规则">设置</button>
      <a href="https://github.com/tjsky/TabulaBili/issues" target="_blank" class="link-btn"  title="提交 Bug 或建议">反馈建议</a>
      <a href="https://www.tjsky.net" target="_blank" class="link-btn" title="当前增强版 GitHub 仓库">维护者主页</a>
      <a href="https://wangdaodao.me/2026/tabulabili/" target="_blank" class="link-btn" title="原作者博客与创意来源">灵感来源</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
