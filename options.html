<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabulaBili-Plus 设置</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="options-page">
  <div class="options-shell">
    <header class="header options-header">
      <div class="header-main">
        <div class="logo-area">
          <img src="icon32.png" alt="Logo" class="logo">
          <h1 class="title">TabulaBili-Plus 设置</h1>
        </div>
        <span class="version">V1.2.0</span>
      </div>
      <p class="subtitle">管理首页推荐流、融合比例和内容屏蔽规则。</p>
    </header>

    <main class="options-main">
      <section class="settings-panel">
        <div class="panel-heading">
          <div>
            <h2 class="section-title options-section-title">融合模式</h2>
            <p class="panel-desc">设置融合模式中探索内容与个性内容的合并比例。</p>
          </div>
        </div>

        <div class="ratio-control">
          <div class="ratio-readout">
            <span>探索 <strong id="fusionCleanRatioText">50%</strong></span>
            <span>个性 <strong id="fusionOriginRatioText">50%</strong></span>
          </div>
          <input
            id="fusionCleanRatio"
            class="ratio-slider"
            type="range"
            min="10"
            max="90"
            step="10"
            value="50"
          >
          <div class="ratio-scale" aria-hidden="true">
            <span>探索少</span>
            <span>均衡</span>
            <span>探索多</span>
          </div>
        </div>
        <p class="form-message" id="fusionMessage" role="status"></p>
      </section>

      <section class="settings-panel">
        <div class="panel-heading">
          <div>
            <h2 class="section-title options-section-title">内容屏蔽</h2>
            <p class="panel-desc">规则会作用于所有模式，并在屏蔽后自动尝试补足首页数量。</p>
          </div>
          <label class="switch-row" for="blockerEnabled">
            <span>启用</span>
            <input type="checkbox" id="blockerEnabled">
          </label>
        </div>

        <form class="rule-form" id="ruleForm">
          <label class="field">
            <span class="field-label">规则类型</span>
            <select id="ruleType" class="field-input">
              <option value="up_name_exact">UP 主名精确匹配</option>
              <option value="title_regex">标题关键词正则</option>
            </select>
          </label>
          <label class="field field-grow">
            <span class="field-label">规则内容</span>
            <input id="rulePattern" class="field-input" type="text" autocomplete="off" placeholder="例如：某某官方号 或 抽奖|带货">
          </label>
          <button type="submit" class="primary-btn">添加规则</button>
        </form>
        <p class="form-message" id="formMessage" role="status"></p>
      </section>

      <section class="settings-panel">
        <div class="panel-heading compact">
          <h2 class="section-title options-section-title">规则列表</h2>
          <span class="rule-count" id="ruleCount">0 条</span>
        </div>
        <div class="rules-list" id="rulesList"></div>
      </section>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
